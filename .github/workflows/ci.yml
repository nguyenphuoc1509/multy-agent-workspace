name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the pull-request job commit a regenerated docs/api/openapi.yaml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest   # Docker is preinstalled: Testcontainers starts real PostgreSQL 16
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # keep equal to <java.version> in pom.xml
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify (backend)
        working-directory: backend
        run: mvn -B -ntp verify
      # OpenApiExportTest rewrites docs/api/openapi.yaml during mvn verify.
      - name: Commit regenerated docs/api/openapi.yaml (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs/api/openapi.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/api/openapi.yaml
            git commit -m "chore: regenerate docs/api/openapi.yaml [skip ci]"
            git push
          fi
      - name: Fail if docs/api/openapi.yaml is out of date (main and manual runs)
        if: github.event_name != 'pull_request'
        run: git diff --exit-code -- docs/api/openapi.yaml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload generated OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.yaml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
