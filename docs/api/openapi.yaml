openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /api/v1/projects:
    get:
      tags:
      - project-controller
      operationId: list
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseProjectResponse"
    post:
      tags:
      - project-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "204":
          description: No Content
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/projects/{projectId}:
    get:
      tags:
      - project-controller
      operationId: get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    patch:
      tags:
      - project-controller
      operationId: update
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /api/v1/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
components:
  schemas:
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 10000
          minLength: 0
        dailyTokenBudget:
          type: integer
          format: int64
      required:
      - name
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        dailyTokenBudget:
          type: integer
          format: int64
        myRole:
          type: string
          enum:
          - OWNER
          - APPROVER
          - VIEWER
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 0
        password:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - email
      - password
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
          pattern: .*\S.*
        description:
          type: string
          maxLength: 10000
          minLength: 0
        dailyTokenBudget:
          type: integer
          format: int64
    PageResponseProjectResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        nextCursor:
          type: string
