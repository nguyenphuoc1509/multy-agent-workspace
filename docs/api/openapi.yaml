          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        isBuiltin:
          type: boolean
        activeConfigVersion:
          $ref: "#/components/schemas/ActiveConfig"
    CreateDocumentRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - REQUIREMENTS
          - ARCHITECTURE
          - API_CONTRACT
          - ADR
        title:
          type: string
          maxLength: 200
          minLength: 0
        content:
          type: string
