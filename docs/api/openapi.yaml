components:
  schemas:
    ContextDocument:
      type: object
      properties:
        type:
          type: string
          enum:
          - REQUIREMENTS
          - ARCHITECTURE
          - API_CONTRACT
          - ADR
        mode:
          type: string
          enum:
          - FULL
          - SUMMARY
        required:
          type: boolean
      required:
      - mode
      - type
    ContextProfile:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ContextDocument"
        includeUnapproved:
          type: boolean
        recentMessages:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
      required:
      - documents
      - recentMessages
    CreateConfigVersionRequest:
      type: object
      properties:
        systemPrompt:
          type: string
          maxLength: 20000
          minLength: 0
        contextProfile:
          $ref: "#/components/schemas/ContextProfile"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          maxItems: 60
          minItems: 0
      required:
      - contextProfile
      - permissions
      - systemPrompt
    Permission:
      type: object
      properties:
        code:
          type: string
          enum:
          - READ_DOCUMENT
          - PROPOSE_DOCUMENT
          - COMMENT_ON_VERSION
          - READ_REPO
          - EXPORT_PATCH
          - PROPOSE_TASK
        resourceType:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - code
    ConfigVersionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        versionNo:
          type: integer
          format: int32
        systemPrompt:
          type: string
        contextProfile:
