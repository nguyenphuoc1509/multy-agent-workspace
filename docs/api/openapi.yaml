          - VIEWER
        createdAt:
          type: string
          format: date-time
    CreateRoleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: "^[A-Z][A-Z0-9_]{1,39}$"
        name:
          type: string
          maxLength: 100
          minLength: 0
        systemPrompt:
          type: string
          maxLength: 20000
          minLength: 0
        contextProfile:
          $ref: "#/components/schemas/ContextProfile"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          maxItems: 60
          minItems: 0
      required:
      - code
      - contextProfile
      - name
      - permissions
      - systemPrompt
